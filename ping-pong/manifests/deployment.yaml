apiVersion: apps/v1
kind: Deployment
metadata:
  name: ping-pong-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ping-pong
  template:
    metadata:
      labels:
        app: ping-pong
    spec:
      containers:
        - name: ping-pong
          image: oppearo/ping-pong-go@sha256:676ee41d9186c4b82b4436b92e3d8edc5ad7b29cdde207c64d62c343a474015f
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "3002"

