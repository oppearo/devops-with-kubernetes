apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      containers:
        - name: log-output
          image: oppearo/log-output@sha256:622931945d6d183e54d1018b49e14333a4bd2c65cd24b86ef7201280a5b60242
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "3000"

