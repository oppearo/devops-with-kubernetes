apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      volumes:
        - name: shared-volume
          emptyDir: {}
      containers:
        - name: log-output-generator
          image: oppearo/log-output@sha256:2512ce9e4309fb287ad441e161907e7996d6fd6a0fd451b91ed6efe2166c51b2
          command: ["/bin/generator"]
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: shared-volume
              mountPath: /shared
        - name: log-output-contentserver
          image: oppearo/log-output@sha256:2512ce9e4309fb287ad441e161907e7996d6fd6a0fd451b91ed6efe2166c51b2
          command: ["/bin/contentserver"]
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "3000"
          volumeMounts:
            - name: shared-volume
              mountPath: /shared
